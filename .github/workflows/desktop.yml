name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (for example v1.0.1). A new tag will point to the selected commit.'
        required: true
        type: string
      release_description:
        description: 'Release description (Markdown supported). Leave blank to generate notes for a new release.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package and test (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux packaging and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libgtk-3-0t64 libnss3 libasound2t64 libgbm1 rpm
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Build desktop installers (ad-hoc signed on macOS)
        run: npm run desktop:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test desktop backend with Electron runtime
        run: npm run desktop:test
      - name: Smoke test packaged macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          executable=(release/mac*/Folio\ Finance\ Tracker.app/Contents/MacOS/Folio\ Finance\ Tracker)
          if [ "${#executable[@]}" -ne 1 ]; then
            echo "Expected one packaged macOS executable; found ${#executable[@]}"
            exit 1
          fi
          "${executable[0]}" --smoke-test
      - name: Verify macOS ad-hoc signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(release/mac*/*.app)
          if [[ "${#apps[@]}" -ne 1 ]]; then
            echo "Expected one packaged macOS app; found ${#apps[@]}"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          signature=$(codesign --display --verbose=2 "${apps[0]}" 2>&1)
          if [[ "$signature" != *"Signature=adhoc"* ]]; then
            echo "Expected an ad-hoc signed macOS app."
            exit 1
          fi
      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'release/win-unpacked/Folio Finance Tracker.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          exit $process.ExitCode
      - name: Smoke test packaged Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run --auto-servernum release/linux-unpacked/finance-tracker --smoke-test --no-sandbox
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: finance-tracker-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    name: Publish release with installers
    needs: package
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      RELEASE_DESCRIPTION: ${{ inputs.release_description }}
    steps:
      - name: Check out built commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tags must start with v (for example v1.0.1)."
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
              echo "The release tag points to a different commit than this build. Choose a new tag or run the workflow on that tag."
              exit 1
            fi
          fi
      - name: Download installers from all platforms
        uses: actions/download-artifact@v4
        with:
          pattern: finance-tracker-*
          path: installers
          merge-multiple: true
      - name: Create release or attach installers to existing release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(installers/*.exe installers/*.dmg installers/*.zip installers/*.AppImage installers/*.deb)
          if (( ${#assets[@]} == 0 )); then
            echo "No installers were downloaded."
            exit 1
          fi
          notes_file="$RUNNER_TEMP/release-notes.md"
          if [[ -n "$RELEASE_DESCRIPTION" ]]; then
            printf '%s\n' "$RELEASE_DESCRIPTION" > "$notes_file"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            if [[ -n "$RELEASE_DESCRIPTION" ]]; then
              gh release edit "$RELEASE_TAG" --notes-file "$notes_file"
            fi
          else
            notes_args=(--generate-notes)
            if [[ -n "$RELEASE_DESCRIPTION" ]]; then
              notes_args=(--notes-file "$notes_file")
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$(git rev-parse HEAD)" \
              --title "Finance Tracker $RELEASE_TAG" \
              "${notes_args[@]}"
          fi
