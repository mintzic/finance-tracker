name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package and test (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux packaging and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libgtk-3-0t64 libnss3 libasound2t64 libgbm1 rpm
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Build desktop installers
        run: npm run desktop:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Test desktop backend with Electron runtime
        run: npm run desktop:test
      - name: Smoke test packaged macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          executable=(release/mac*/Finance\ Tracker.app/Contents/MacOS/Finance\ Tracker)
          if [ "${#executable[@]}" -ne 1 ]; then
            echo "Expected one packaged macOS executable; found ${#executable[@]}"
            exit 1
          fi
          "${executable[0]}" --smoke-test
      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'release/win-unpacked/Finance Tracker.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          exit $process.ExitCode
      - name: Smoke test packaged Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run --auto-servernum release/linux-unpacked/finance-tracker --smoke-test --no-sandbox
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: finance-tracker-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
