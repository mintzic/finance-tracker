name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run desktop:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run desktop:test
      - name: Smoke test packaged macOS app
        if: runner.os == 'macOS'
        run: |
          executable=(release/mac*/Finance\ Tracker.app/Contents/MacOS/Finance\ Tracker)
          "${executable[0]}" --smoke-test
      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        run: |
          $process = Start-Process -FilePath 'release/win-unpacked/Finance Tracker.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          exit $process.ExitCode
      - name: Smoke test packaged Linux app
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum release/linux-unpacked/finance-tracker --smoke-test --no-sandbox
      - uses: actions/upload-artifact@v4
        with:
          name: finance-tracker-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
